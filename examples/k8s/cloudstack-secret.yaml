apiVersion: v1
kind: Secret
metadata:
  name: cloudstack-secret
  namespace: default
type: Opaque
stringData:
  # Create from .env.cloudstack (copy .env.cloudstack.example -> .env.cloudstack)
  # kubectl create secret generic cloudstack-secret --from-env-file=.env.cloudstack
  CLOUDSTACK_ENDPOINT: ""
  CLOUDSTACK_API_KEY: ""
  CLOUDSTACK_SECRET_KEY: ""
  VERIFY_SSL: "false"
