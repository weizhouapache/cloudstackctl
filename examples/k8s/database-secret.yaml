apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: default
type: Opaque
stringData:
  # Create from .env.database (copy .env.database.example -> .env.database)
  # kubectl create secret generic database-secret --from-env-file=.env.database
  # Preferred: provide DATABASE_DSN or the PG* values below
  DATABASE_DSN: ""
  PGHOST: ""
  PGUSER: ""
  PGPASSWORD: ""
  PGDATABASE: ""
  PGPORT: ""
  PGSSLMODE: "disable"
