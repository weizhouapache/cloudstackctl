version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: cloudstackctl
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  controller:
    build: .
    command: ["/cloudstackctl-controller"]
    env_file:
      - .env.cloudstack
      - .env.database
    depends_on:
      - postgres
    ports:
      - "65426:65426"

volumes:
  pgdata:
    driver: local
